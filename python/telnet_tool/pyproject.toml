[project]
name = "telnet-tool"
version = "0.1.0"
description = "Portable telnet CLI: send commands, wait for prompt, capture output"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "telnetlib3>=2.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
